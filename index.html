    .option-label {

      align-items: center;

      border: 1px solid var(--border); 
      border-radius: 8px;

      color: white; 
      border: none; 
      padding: 14px 28px; 
      font-size: 1.15rem;

      cursor: pointer;

    .result-box {

    q: "قيمة $\\lim_{n \\to \\infty} \\frac{5n^3 + 2}{2n^3 - n + 1}$ تساوي:",
    options: ["$\\frac{5}{2}$", "$0$", "$+\\infty$", "$\\frac{2}{5}$"],
    answer: 0,
    exp: "<p>نسبة أمثال الحدين المسيطرين من الدرجة الثالثة: $\\frac{5n^3}{2n^3} = \\frac{5}{2}$.</p>"
  },
  // 40. تباعد متتالية
  {
    q: "إذا كانت المتتالية $(u_n)$ متزايدة تماماً وغير محدودة من الأعلى، فإن نهايتها تكون:",
    options: ["$+\\infty$", "$0$", "$1$", "غير معينة"],
    answer: 0,
    exp: "<p>مبرهنة أساسية: كل متتالية متزايدة وغير محدودة من الأعلى تنتهي دوماً وتتباعد نحو $+\\infty$.</p>"
  }
];

function renderQuiz() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = quizData.map((item, index) => {
    return `
      <div class="question-card" id="card-${index}">
        <div class="question-title">السؤال ${index + 1}: ${item.q}</div>
        ${item.graph ? item.graph : ''}
        <div class="options">
          ${item.options.map((opt, optIndex) => `
            <label class="option-label" id="label-${index}-${optIndex}">
              <input type="radio" name="question-${index}" value="${optIndex}">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
        <div class="explanation" id="exp-${index}">
          <div style="font-weight:bold; color:var(--primary); margin-bottom:8px; border-bottom:1px solid #e2e8f0; padding-bottom:4px;">
            طريقة الحل والشرح الرياضي المفصل:
          </div>
          ${item.exp}
        </div>
      </div>
    `;
  }).join('');
}

function typesetMath() {
  if (window.MathJax && window.MathJax.typesetPromise) {
    MathJax.typesetClear();
    MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err));
  }
}

function submitQuiz() {
  let score = 0;
  quizData.forEach((item, index) => {
    const selected = document.querySelector(`input[name="question-${index}"]:checked`);
    const expDiv = document.getElementById(`exp-${index}`);
    expDiv.style.display = 'block';

    const correctLabel = document.getElementById(`label-${index}-${item.answer}`);
    correctLabel.classList.add('correct-opt');

    if (selected) {
      const userAns = parseInt(selected.value);
      if (userAns === item.answer) {
        score++;
      } else {
        const userLabel = document.getElementById(`label-${index}-${userAns}`);
        userLabel.classList.add('wrong-opt');
      }
    }
  });

  const resultBox = document.getElementById('resultBox');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const gradeMsg = document.getElementById('gradeMsg');
  
  resultBox.style.display = 'block';
  scoreDisplay.textContent = `${score} / 40`;

  if (score >= 36) gradeMsg.textContent = "ممتاز جداً! استيعاب كامل ومتقن لجميع مفاهيم وحدة نهاية المتتالية.";
  else if (score >= 28) gradeMsg.textContent = "أداء جيد جداً! راجع خطوات الحل المفصلة للأسئلة الخاطئة لضبط الملاحظات الدقيقة.";
  else if (score >= 20) gradeMsg.textContent = "مستوى متوسط، ركّز على أسئلة الراجح والقاصر ومبرهنات الإحاطة في المجاميع.";
  else gradeMsg.textContent = "بحاجة لمراجعة عامة؛ اقرأ التعليلات التفصيلية المعروضة تحت كل سؤال بدقة.";

  document.getElementById('submitBtn').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  typesetMath();
}

window.onload = () => {
  renderQuiz();
  typesetMath();
};
</script>

</body>
</html>
