      background-color: #f8fafc;

      color: white; 
      border: none;

      border-radius: 10px;

    exp: "بإخراج $n$ عاملاً مشتركاً من الجذر: $\\frac{n\\sqrt{1 + 1/n^2}}{n(3 - 2/n)} \\to \\frac{1}{3}$."
  },
  {
    q: "إذا كانت المتتالية $u_n = \\frac{a n + 5}{2n - 1}$ تتقارب نحو العدد $4$، فإن قيمة الثابت $a$ هي:",
    options: ["$2$", "$4$", "$8$", "$10$"],
    answer: 2,
    exp: "نهاية المتتالية هي $\\frac{a}{2}$. وبما أن النهاية المعطاة هي $4$، فإن $\\frac{a}{2} = 4 \\Rightarrow a = 8$."
  },
  {
    q: "المتتالية $u_n = \\frac{(-1)^n}{n^2}$ هي متتالية:",
    options: ["متقاربة نحو $0$", "متباعدة", "متقاربة نحو $1$", "متقاربة نحو $-1$"],
    answer: 0,
    exp: "لدينا $\vert{}u_n\vert{} = \\frac{1}{n^2} \\to 0$، ومنه المتتالية تتقارب حتماً نحو الصفر."
  },
  {
    q: "إذا كانت $u_n = n - \\sqrt{n^2 + 4n}$، فإن $\\lim_{n \\to \\infty} u_n$ تساوي:",
    options: ["$-2$", "$0$", "$2$", "$-\\infty$"],
    answer: 0,
    exp: "بالضرب بالمرافق: $\\frac{n^2 - (n^2 + 4n)}{n + \\sqrt{n^2+4n}} = \\frac{-4n}{n + n\\sqrt{1+4/n}} \\to \\frac{-4}{1+1} = -2$."
  }
];

function renderQuiz() {
  const container = document.getElementById('questionsContainer');
  container.innerHTML = quizData.map((item, index) => {
    return `
      <div class="question-card" id="card-${index}">
        <div class="question-title">السؤال ${index + 1}: ${item.q}</div>
        <div class="options">
          ${item.options.map((opt, optIndex) => `
            <label class="option-label" id="label-${index}-${optIndex}">
              <input type="radio" name="question-${index}" value="${optIndex}">
              <span>${opt}</span>
            </label>
          `).join('')}
        </div>
        <div class="explanation" id="exp-${index}">
          <strong>طريقة الحل والتعليل:</strong> ${item.exp}
        </div>
      </div>
    `;
  }).join('');
}

function submitQuiz() {
  let score = 0;
  quizData.forEach((item, index) => {
    const selected = document.querySelector(`input[name="question-${index}"]:checked`);
    const expDiv = document.getElementById(`exp-${index}`);
    expDiv.style.display = 'block';

    const correctLabel = document.getElementById(`label-${index}-${item.answer}`);
    correctLabel.classList.add('correct-opt');

    if (selected) {
      const userAns = parseInt(selected.value);
      if (userAns === item.answer) {
        score++;
      } else {
        const userLabel = document.getElementById(`label-${index}-${userAns}`);
        userLabel.classList.add('wrong-opt');
      }
    }
  });

  const resultBox = document.getElementById('resultBox');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const gradeMsg = document.getElementById('gradeMsg');
  
  resultBox.style.display = 'block';
  scoreDisplay.textContent = `${score} / 40`;

  if (score >= 36) gradeMsg.textContent = "ممتاز! استيعاب شامل ومتقن لمفاهيم الوحدة.";
  else if (score >= 28) gradeMsg.textContent = "جيد جداً، راجع التعليلات المرفقة للأسئلة الخاطئة لضبط القواعد بدقة.";
  else if (score >= 20) gradeMsg.textContent = "مستوى متوسط، ركّز على إزالة عدم التعيين ومبرهنات الإحاطة والمتتاليات المحدودة.";
  else gradeMsg.textContent = "بحاجة لمراجعة عامة لمفاهيم تقارب وتباعد المتتاليات وتمارين الوحدة.";

  document.getElementById('submitBtn').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (window.MathJax) {
    MathJax.typesetPromise();
  }
}

window.onload = () => {
  renderQuiz();
  if (window.MathJax) {
    MathJax.typesetPromise();
  }
};
</script>

</body>
</html>
